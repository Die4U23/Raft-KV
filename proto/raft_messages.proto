syntax = "proto3";
package raftcore;

message RequestVote {
    int32 term = 1;
    int32 candidate_id = 2;
    int64 last_log_index = 3;
    int64 last_log_term  = 4;
    // Pre-Vote (Raft thesis §9.6). term is the prospective next term.
    // Receivers must not persist a vote or adopt this term.
    bool prevote = 5;
}

message RequestVoteResponse {
    int32 term = 1;
    bool vote_granted = 2;
    // Echoes RequestVote.prevote. A delayed real vote must not count as a pre-vote.
    bool prevote = 3;
}

message AppendEntries {
    int32 term = 1;
    int32 leader_id = 2;
    int64 prev_log_index = 3;
    int64 prev_log_term  = 4;
    repeated LogEntry entries = 5;
    int64 leader_commit = 6;
    uint64 rpc_id = 7; // correlates retransmissions and responses within a term
}

message AppendEntriesResponse {
    int32 term = 1;
    bool success = 2;
    int64 last_log_index = 3;
    uint64 rpc_id = 4; // echo AppendEntries.rpc_id; success index is matched prefix
}

message LogEntry {
    int64 index = 1;
    int32 term  = 2;
    bytes command = 3;
}

// Snapshot transfer. data is one chunk of the KV image at last_included_index.
// offset is the byte position of this chunk. done marks the last chunk.
message InstallSnapshot {
    int32 term = 1;
    int32 leader_id = 2;
    int64 last_included_index = 3;
    int64 last_included_term = 4;
    uint64 rpc_id = 5;
    bytes data = 6;
    uint64 offset = 7;
    bool done = 8;
    // Applied voter set, frozen with the snapshot image. Empty keeps the
    // receiver's current voters so older snapshots stay compatible.
    bytes voters = 9;
}

message InstallSnapshotResponse {
    int32 term = 1;
    bool success = 2;
    uint64 rpc_id = 3;
}

// Multiplex wrapper — all Raft RPCs share one TCP channel per peer pair.
message RaftMessage {
    int32 sender_id = 1;
    oneof payload {
        RequestVote request_vote = 2;
        RequestVoteResponse request_vote_response = 3;
        AppendEntries append_entries = 4;
        AppendEntriesResponse append_entries_response = 5;
        InstallSnapshot install_snapshot = 6;
        InstallSnapshotResponse install_snapshot_response = 7;
    }
}
